[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openjev"
version = "0.3.1"
description = "An independent, reproducible experiment in typed probabilistic decisions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY.md"]
keywords = ["machine-learning", "probabilistic-decisions", "qwen", "classification"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<3",
  "transformers>=4.57.6,<4.58",
  "sentence-transformers>=5,<6",
  "huggingface-hub>=0.34,<1",
  "safetensors>=0.5,<1",
  "numpy>=1.26,<3",
  "scikit-learn>=1.6,<2",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pyarrow>=19,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "matplotlib>=3.10,<4"]
qwen = ["peft>=0.17,<0.19", "accelerate>=1.5,<2"]

[project.urls]
Homepage = "https://github.com/IamBusy/OpenJev"
Repository = "https://github.com/IamBusy/OpenJev"
Issues = "https://github.com/IamBusy/OpenJev/issues"

[project.scripts]
openjev = "openjev.cli:main"
openjev-qwen = "openjev.qwen_cli:main"
openjev-branch = "openjev.branch_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openjev"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/configs", "/docs", "/examples", "/reports",
  "/data/README.md", "/data/SOURCE_LOCK.json", "/data/v02/SOURCE_LOCK.json",
  "/data/v03/*.json", "/.github", "/.env.example", "/.gitignore", "/uv.lock",
  "/README*.md", "/LICENSE", "/THIRD_PARTY.md", "/CONTRIBUTING.md",
  "/SECURITY.md", "/CHANGELOG.md", "/CITATION.cff", "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
